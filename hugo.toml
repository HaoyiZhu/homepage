title = "Haoyi Zhu"
baseURL = "https://haoyizhu.site/"
hasCJKLanguage = true
enableEmoji = true
enableRobotsTXT = true
summaryLength = 30
disableKinds = ["taxonomy", "term"]

[outputs]
  home = ["HTML"]
  section = ["HTML"]

[markup]
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
  [markup.goldmark.renderer]
    unsafe = true
  [markup.goldmark.extensions.passthrough]
    enable = true
    [markup.goldmark.extensions.passthrough.delimiters]
      block = [["$$", "$$"], ["\\[", "\\]"]]
      inline = [["$", "$"], ["\\(", "\\)"]]
  [markup.highlight]
    noClasses = true
    style = "github"

[params]
  description = "Haoyi Zhu — Ph.D. student in Computer Science. Research on world models, embodied AI, and spatial intelligence."
